name: iOS link (init script)

# Same question as ios-link.yml, asked without touching any class files.
#
# ios-link.yml patched KotlinNativeTargetPresetKt in the plugin jar to force
# getEnabledOnCurrentHostForBinariesCompilation to return true. That produced a JVM verifier
# error ("Expecting a stack map frame"): overwriting ifeq with iconst_1/ireturn leaves a stale
# StackMapTable entry behind. Bytecode surgery was the wrong level.
#
# The task's `enabled` flag is an ordinary Gradle property, and KGP sets it during
# configuration. An init script that runs after evaluation can simply set it back, which is
# both simpler and verifiable: if the task is skipped we will see SKIPPED, not a crash.
#
# The konan.properties part stays: K/N needs to be told which binary performs the final link,
# because it only ships macOS conventions (linker.macos_*). The new entry points that at LLD 20
# wrapped as ld64.lld, plus a real iPhoneOS sysroot.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/ios-link2.yml']

concurrency:
  group: ios-link2-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SDK_VERSION: '16.5'
  KONAN_VERSION: '2.4.21'

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: LLD 20 as the iOS linker
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lld-20
          LLD=$(command -v ld.lld-20)
          sudo mkdir -p /opt/ioslink
          printf '#!/bin/sh\nexec %s -flavor darwin "$@"\n' "$LLD" | sudo tee /opt/ioslink/ld64.lld >/dev/null
          sudo chmod 755 /opt/ioslink/ld64.lld
          /opt/ioslink/ld64.lld --version

      - name: iPhoneOS SDK stubs
        run: |
          set -euo pipefail
          curl -sSL --retry 3 "https://codeload.github.com/theos/sdks/tar.gz/refs/heads/master" -o /tmp/s.tar.gz
          tar xzf /tmp/s.tar.gz -C /tmp --wildcards "*/iPhoneOS${SDK_VERSION}.sdk/*"
          sudo rm -rf /opt/ioslink/SDKs/iPhoneOS.sdk
          sudo mkdir -p /opt/ioslink/SDKs
          sudo mv "/tmp/sdks-master/iPhoneOS${SDK_VERSION}.sdk" /opt/ioslink/SDKs/iPhoneOS.sdk
          test -f /opt/ioslink/SDKs/iPhoneOS.sdk/usr/lib/libSystem.tbd
          echo "stubs ok"

      - name: Kotlin/Native distribution
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.konan"
          curl -sSL --retry 3 -o /tmp/k.tgz "https://github.com/JetBrains/kotlin/releases/download/v$KONAN_VERSION/kotlin-native-prebuilt-$KONAN_VERSION-linux-x86_64.tar.gz"
          tar xzf /tmp/k.tgz -C "$HOME/.konan"
          echo "KONAN=$HOME/.konan/kotlin-native-prebuilt-linux-x86_64-$KONAN_VERSION" >> "$GITHUB_ENV"
          test -d "$HOME/.konan/kotlin-native-prebuilt-linux-x86_64-$KONAN_VERSION/klib/platform/ios_arm64"

      - name: Point K/N at LLD 20
        run: |
          set -euo pipefail
          P="$KONAN/konan/konan.properties"
          cp "$P" "$P.orig"
          python3 - "$P" <<'PY'
          import sys, re
          p = sys.argv[1]
          t = open(p).read()
          add = [
            "linker.linux_x64-ios_arm64 = /opt/ioslink/ld64.lld",
            "targetToolchain.linux_x64-ios_arm64 = /opt/ioslink",
            "targetSysRoot.ios_arm64 = /opt/ioslink/SDKs/iPhoneOS.sdk",
            "sdkVersion.ios = 16.5",
          ]
          for line in add:
              key = line.split("=")[0].strip()
              t = re.sub(rf"^{re.escape(key)}\s*=.*$", "", t, flags=re.M)
          t += "\n# Linux cross link\n" + "\n".join(add) + "\n"
          open(p, "w").write(t)
          print("added", len(add), "entries")
          PY
          grep -n 'linux_x64-ios_arm64\|^targetSysRoot.ios_arm64' "$P"

      - name: Re-enable the link task after evaluation
        run: |
          set -euo pipefail
          cat > /tmp/enable.gradle <<'GRADLE'
          gradle.projectsEvaluated {
              allprojects { p ->
                  p.tasks.matching { t ->
                      t.name.toLowerCase().contains('linkdebugframeworkiosarm64')
                  }.configureEach { enabled = true }
              }
          }
          GRADLE
          sed -i 's/^          //' /tmp/enable.gradle
          cat /tmp/enable.gradle

      - name: Link the Shared framework for ios_arm64
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew :shared:linkDebugFrameworkIosArm64 --console=plain --no-daemon \
            --init-script /tmp/enable.gradle \
            -Pkotlin.native.ignoreDisabledTargets=true 2>&1 | tee /tmp/link.log | tail -70
          ls -la shared/build/bin/iosArm64/debugFramework/ 2>/dev/null || true

      - name: Inspect the result
        if: always()
        run: |
          {
            echo "### link stage"
            echo '```'
            grep -nE 'SKIPPED|FAILED|error:|What went wrong|ld64|lld' /tmp/link.log | tail -30 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          find android/shared/build/bin -maxdepth 3 -type d 2>/dev/null | head

      - name: Upload framework if produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-framework
          path: android/shared/build/bin/iosArm64/debugFramework/
          retention-days: 5
          if-no-files-found: warn
